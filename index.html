<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BuyLog - 購物記錄器</title>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <div id="app" class="max-w-md mx-auto relative min-h-screen">
        <!-- 頂部導覽欄 -->
        <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight">BuyLog</h1>
            <div id="user-section" class="flex items-center gap-3">
                <span id="loading-spinner" class="text-sm text-gray-400">連線中...</span>
            </div>
        </header>

        <!-- 主內容視圖容器 -->
        <main id="main-view" class="p-4 pb-28">
            <!-- 未登入視圖 -->
            <section id="view-login" class="hidden py-20 text-center">
                <div class="bg-white p-8 rounded-3xl shadow-lg inline-block w-full border border-gray-100">
                    <h2 class="text-2xl font-bold mb-4">歡迎使用 BuyLog</h2>
                    <p class="text-base text-gray-500 mb-8">登入後即可開始記錄您的日常購物。</p>
                    <button id="btn-login" class="w-full bg-blue-500 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-blue-200 shadow-lg hover:bg-blue-600 transition-transform active:scale-95">
                        使用 Google 帳號登入
                    </button>
                </div>
            </section>

            <!-- 新增紀錄視圖 -->
            <section id="view-add" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-md border border-gray-50">
                    <h2 class="text-xl font-bold mb-5 text-gray-800">新增購物記錄</h2>
                    <form id="add-form" class="space-y-5">
                        <div class="space-y-2">
                            <label class="block text-base font-bold text-gray-700">商品照片</label>
                            <div id="camera-box" class="w-full h-52 bg-blue-50 border-2 border-dashed border-blue-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                                <img id="preview-img" src="" class="hidden w-full h-full object-contain">
                                <div id="camera-placeholder" class="text-center">
                                    <svg class="w-12 h-12 text-blue-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    <p class="text-base text-blue-400 font-bold">點擊拍照 / 上傳</p>
                                </div>
                                <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden">
                            </div>
                            <button type="button" id="btn-remove-img" class="hidden text-sm text-red-500 font-medium underline py-1">移除照片</button>
                        </div>
                        <div>
                            <label class="block text-base font-bold text-gray-700">商品名稱 / 描述</label>
                            <input type="text" id="input-name" required placeholder="例如：拿鐵咖啡" class="mt-1 block w-full px-4 py-3 bg-gray-50 border-0 rounded-xl text-base focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-base font-bold text-gray-700">價格</label>
                                <input type="number" id="input-price" required placeholder="0" class="mt-1 block w-full px-4 py-3 bg-gray-50 border-0 rounded-xl text-base focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-base font-bold text-gray-700">日期</label>
                                <input type="date" id="input-date" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border-0 rounded-xl text-base focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-save" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-blue-700 transition-transform active:scale-95 mt-4">
                            儲存紀錄
                        </button>
                    </form>
                </div>
            </section>

            <!-- 歷史紀錄視圖 -->
            <section id="view-history" class="hidden space-y-4">
                <div class="bg-white p-5 rounded-3xl shadow-sm space-y-4 border border-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="relative flex-grow">
                            <input type="text" id="search-keyword" placeholder="搜尋商品..." class="w-full pl-11 pr-4 py-3 bg-gray-50 border-0 rounded-2xl text-base focus:ring-2 focus:ring-blue-500">
                            <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <button id="btn-toggle-filter" class="p-3 bg-gray-100 text-gray-600 rounded-2xl active:bg-gray-200">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        </button>
                    </div>
                    <!-- 日期區間過濾 -->
                    <div id="filter-date-range" class="hidden grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
                        <div>
                            <label class="block text-xs text-gray-400 font-black uppercase tracking-wider mb-1">開始日期</label>
                            <input type="date" id="filter-start" class="w-full px-4 py-2 bg-gray-50 border-0 rounded-xl text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 font-black uppercase tracking-wider mb-1">結束日期</label>
                            <input type="date" id="filter-end" class="w-full px-4 py-2 bg-gray-50 border-0 rounded-xl text-sm font-medium">
                        </div>
                        <button id="btn-clear-filter" class="col-span-2 text-sm text-blue-500 font-bold text-center py-2 bg-blue-50 rounded-xl">清除過濾條件</button>
                    </div>
                </div>

                <div id="history-container" class="space-y-4">
                    <!-- 資料由 JS 注入 -->
                </div>
            </section>
        </main>

        <!-- 底部導覽 (Tabs) -->
        <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-3 pb-8 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-40 max-w-md mx-auto">
            <button class="nav-tab flex flex-col items-center gap-1 px-6 py-2 text-blue-600 transition-colors" data-view="add">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span class="text-xs font-black">新增</span>
            </button>
            <button class="nav-tab flex flex-col items-center gap-1 px-6 py-2 text-gray-400 transition-colors" data-view="history">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span class="text-xs font-black">歷史</span>
            </button>
        </nav>

        <!-- Modals 略，同樣優化字體 -->
        <div id="modal-image" class="hidden fixed inset-0 z-[100] bg-black bg-opacity-95 flex items-center justify-center p-4">
            <button id="btn-close-img-modal" class="absolute top-6 right-6 text-white bg-white/20 p-2 rounded-full">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="full-img" src="" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg">
        </div>

        <div id="modal-edit" class="hidden fixed inset-0 z-[90] bg-black bg-opacity-60 flex items-end justify-center p-0">
            <div class="bg-white w-full rounded-t-[2.5rem] p-8 shadow-2xl animate-slide-up">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black text-gray-800">修改紀錄</h3>
                    <button id="btn-close-edit-modal" class="text-gray-400 p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <form id="edit-form" class="space-y-6">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-base font-bold text-gray-500 mb-2">商品名稱 / 描述</label>
                        <input type="text" id="edit-name" required class="block w-full px-5 py-4 bg-gray-50 border-0 rounded-2xl text-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-base font-bold text-gray-500 mb-2">價格</label>
                        <input type="number" id="edit-price" required class="block w-full px-5 py-4 bg-gray-50 border-0 rounded-2xl text-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex gap-4 pt-6">
                        <button type="button" id="btn-delete-record" class="flex-1 bg-red-50 text-red-600 py-4 rounded-2xl font-bold text-base">
                            刪除
                        </button>
                        <button type="submit" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95">
                            儲存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <style>
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        input[type="date"] { min-height: 3rem; }
    </style>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
