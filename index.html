<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyLog - 購物記錄器</title>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="app" class="max-w-md mx-auto relative min-h-screen">
        <!-- 頂部導覽欄 -->
        <header class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-xl font-bold text-blue-600">BuyLog</h1>
            <div id="user-section" class="flex items-center gap-2">
                <span id="loading-spinner" class="text-xs text-gray-400">連線中...</span>
            </div>
        </header>

        <!-- 主內容視圖容器 -->
        <main id="main-view" class="p-4 pb-24">
            <!-- 未登入視圖 (略，保持不變) -->
            <section id="view-login" class="hidden py-20 text-center">
                <div class="bg-white p-8 rounded-2xl shadow-lg inline-block w-full">
                    <h2 class="text-2xl font-bold mb-4">歡迎使用 BuyLog</h2>
                    <p class="text-gray-500 mb-6">登入後即可開始記錄您的日常購物。</p>
                    <button id="btn-login" class="bg-blue-500 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:bg-blue-600 transition-transform active:scale-95">
                        使用 Google 登入
                    </button>
                </div>
            </section>

            <!-- 新增紀錄視圖 (略，保持不變) -->
            <section id="view-add" class="hidden space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-md">
                    <h2 class="text-lg font-bold mb-4 text-gray-700">新增購物記錄</h2>
                    <form id="add-form" class="space-y-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-600">商品照片</label>
                            <div id="camera-box" class="w-full h-48 bg-blue-50 border-2 border-dashed border-blue-200 rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                                <img id="preview-img" src="" class="hidden w-full h-full object-contain">
                                <div id="camera-placeholder" class="text-center">
                                    <svg class="w-10 h-10 text-blue-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    <p class="text-sm text-blue-400 font-medium">點擊拍照 / 上傳</p>
                                </div>
                                <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden">
                            </div>
                            <button type="button" id="btn-remove-img" class="hidden text-xs text-red-500 underline py-1">移除照片</button>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">商品名稱</label>
                            <input type="text" id="input-name" required class="mt-1 block w-full px-4 py-2 bg-gray-50 border-0 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">價格</label>
                                <input type="number" id="input-price" required class="mt-1 block w-full px-4 py-2 bg-gray-50 border-0 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">日期</label>
                                <input type="date" id="input-date" required class="mt-1 block w-full px-4 py-2 bg-gray-50 border-0 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-save" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-transform active:scale-95 mt-2">
                            儲存紀錄
                        </button>
                    </form>
                </div>
            </section>

            <!-- 歷史紀錄視圖 -->
            <section id="view-history" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-gray-700 px-1">購物歷史紀錄</h2>
                <div id="history-container" class="space-y-3">
                    <!-- 資料由 JS 注入 -->
                </div>
            </section>
        </main>

        <!-- 底部切換分頁 (Tabs) -->
        <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-2 pb-6 shadow-2xl z-40 max-w-md mx-auto">
            <button class="nav-tab flex flex-col items-center p-2 text-blue-600" data-view="add">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                <span class="text-[10px] mt-1 font-bold">新增紀錄</span>
            </button>
            <button class="nav-tab flex flex-col items-center p-2 text-gray-400" data-view="history">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span class="text-[10px] mt-1 font-bold">歷史紀錄</span>
            </button>
        </nav>

        <!-- 彈出視窗：圖片大圖 -->
        <div id="modal-image" class="hidden fixed inset-0 z-[100] bg-black bg-opacity-90 flex items-center justify-center p-4">
            <button id="btn-close-img-modal" class="absolute top-4 right-4 text-white p-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="full-img" src="" class="max-w-full max-h-full object-contain shadow-2xl">
        </div>

        <!-- 彈出視窗：編輯視窗 -->
        <div id="modal-edit" class="hidden fixed inset-0 z-[90] bg-black bg-opacity-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-slide-up sm:animate-none">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-gray-800">修改紀錄</h3>
                    <button id="btn-close-edit-modal" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <form id="edit-form" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-500">商品名稱 / 描述</label>
                        <input type="text" id="edit-name" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500">價格</label>
                        <input type="number" id="edit-price" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex gap-3 pt-4">
                        <button type="button" id="btn-delete-record" class="flex-1 bg-red-50 text-red-600 py-3 rounded-xl font-bold hover:bg-red-100 transition-colors">
                            刪除紀錄
                        </button>
                        <button type="submit" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-transform active:scale-95">
                            儲存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
