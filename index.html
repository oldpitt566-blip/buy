<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物記錄器 - 新增記錄</title>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="app" class="max-w-md mx-auto p-4 pb-20">
    <!-- 導覽列 -->
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">BuyLog</h1>
      <div id="user-info" class="flex items-center gap-2">
        <button id="login-btn" class="bg-blue-500 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-600 transition-colors">Google 登入</button>
      </div>
    </header>

    <!-- 登入後顯示的內容 -->
    <main id="main-content" class="hidden">
      <div class="bg-white p-6 rounded-2xl shadow-md mb-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-800">新增購物記錄</h2>
        <form id="purchase-form" class="space-y-4">
          <!-- 相機/圖片上傳 -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">拍照記錄</label>
            <div id="image-preview-container" class="hidden relative w-full aspect-video bg-gray-200 rounded-lg overflow-hidden border-2 border-dashed border-gray-300">
                <img id="image-preview" src="#" alt="預覽" class="w-full h-full object-contain">
                <button type="button" id="remove-image" class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full text-xs">移除</button>
            </div>
            <label for="camera-input" class="flex flex-col items-center justify-center w-full h-32 bg-blue-50 border-2 border-dashed border-blue-200 rounded-lg cursor-pointer hover:bg-blue-100 transition-colors" id="camera-label">
              <svg class="w-8 h-8 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              <span class="text-sm text-blue-500 font-medium">點擊拍照或上傳圖片</span>
              <input id="camera-input" type="file" accept="image/*" capture="environment" class="hidden">
            </label>
          </div>

          <div>
            <label for="item-name" class="block text-sm font-medium text-gray-700">物品名稱</label>
            <input type="text" id="item-name" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="price" class="block text-sm font-medium text-gray-700">價錢</label>
              <input type="number" id="price" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
              <label for="date" class="block text-sm font-medium text-gray-700">日期</label>
              <input type="date" id="date" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-transform active:scale-95">
            儲存紀錄
          </button>
        </form>
      </div>
    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-3">
        <a href="index.html" class="flex flex-col items-center text-blue-600">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span class="text-xs">新增</span>
        </a>
        <a href="history.html" class="flex flex-col items-center text-gray-500 hover:text-blue-500">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span class="text-xs">紀錄</span>
        </a>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
